name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-qa:
    name: Frontend QA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Lint
        id: lint
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Unit and component tests
        id: unit-tests
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run test:run

      - name: Production build
        id: build
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run build

      - name: Verify Chrome
        id: chrome
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: google-chrome --version

      - name: End-to-end tests
        id: e2e-tests
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run test:e2e

      - name: Publish QA summary
        if: always()
        env:
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          UNIT_RESULT: ${{ steps.unit-tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          CHROME_RESULT: ${{ steps.chrome.outcome }}
          E2E_RESULT: ${{ steps.e2e-tests.outcome }}
        run: |
          {
            echo "## Frontend QA results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Dependencies (npm ci) | ${DEPENDENCIES_RESULT:-not run} |"
            echo "| Lint | ${LINT_RESULT:-not run} |"
            echo "| Unit and component tests | ${UNIT_RESULT:-not run} |"
            echo "| Production build | ${BUILD_RESULT:-not run} |"
            echo "| Chrome availability | ${CHROME_RESULT:-not run} |"
            echo "| Selenium E2E | ${E2E_RESULT:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
